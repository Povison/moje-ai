<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Funkční AI</title>
    <style>
        body { font-family: Arial, sans-serif; background: #131314; color: #e3e3e3; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #setup { display: flex; gap: 10px; padding: 10px 20px; background: #1e1f20; border-bottom: 1px solid #3c4043; font-size: 14px; align-items: center; flex-wrap: wrap; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px; border-radius: 8px; line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
        .user { background: #2b2a2a; align-self: flex-end; color: white; }
        .ai { background: #1e1f20; align-self: flex-start; border: 1px solid #3c4043; }
        #input-container { padding: 20px; background: #131314; display: flex; gap: 10px; border-top: 1px solid #3c4043; }
        input, select { background: #2a2b2d; color: white; border: 1px solid #3c4043; padding: 12px; border-radius: 8px; font-size: 14px; }
        input[type="text"] { flex: 1; }
        button { background: #a8c7fa; color: #041e49; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        button:hover { background: #c2e7ff; }
    </style>
</head>
<body>

    <div id="setup">
        <label for="apiKey">API Klíč:</label>
        <input type="password" id="apiKey" placeholder="Vložte váš klíč..." style="padding: 6px;" oninput="saveKey()">
        <label for="modelSelect">Model:</label>
        <select id="modelSelect" style="padding: 6px;">
            <option value="gemini-1.5-flash">Gemini 1.5 Flash (Rychlý)</option>
            <option value="gemini-2.5-flash">Gemini 2.5 Flash (Nejnovější)</option>
            <option value="gemini-1.5-pro">Gemini 1.5 Pro (Pokročilý)</option>
        </select>
    </div>

    <div id="chat-container">
        <div class="message ai">Úspěšně spuštěno na nové adrese! Vlož klíč, vyber model a napiš zprávu.</div>
    </div>

    <div id="input-container">
        <input type="text" id="userInput" placeholder="Napiš zprávu..." onkeydown="if(event.key === 'Enter') poslatZpravu()">
        <button onclick="poslatZpravu()">Odeslat</button>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('opravdovy_gemini_klic');
            if (savedKey) document.getElementById('apiKey').value = savedKey;
        };

        function saveKey() {
            localStorage.setItem('opravdovy_gemini_klic', document.getElementById('apiKey').value.trim());
        }

        async function poslatZpravu() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('modelSelect').value;
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();

            if (!apiKey) { alert('Zadej API klíč nahoře!'); return; }
            if (!text) return;

            appendMessage(text, 'user');
            inputField.value = '';

            const aiMessageElement = appendMessage('Přemýšlím...', 'ai');

            try {
                const url = 'https://googleapis.com' + model + ':generateContent?key=' + apiKey;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'Chyba serveru');
                }

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                aiMessageElement.innerText = aiText;

            } catch (error) {
                console.error(error);
                aiMessageElement.innerText = 'Chyba: ' + error.message;
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-container');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerText = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
            return msg;
        }
    </script>
</body>
</html>
