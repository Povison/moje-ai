<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blesková Gemini</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; padding: 20px; }
        #povídání { min-height: 200px; margin-bottom: 20px; padding: 10px; background: #222; border-radius: 5px; }
        #výzva { width: 80%; padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; }
        #poslat { padding: 10px 20px; background: #fff; color: #000; border: none; border-radius: 5px; cursor: pointer; }
        #poslat:disabled { background: #444; color: #777; cursor: not-allowed; }
        .user { color: #00ff00; margin-bottom: 5px; }
        .ai { color: #00daff; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="povídání"></div>
    <div id="vstupní oblast">
        <input type="text" id="výzva" placeholder="Zeptej se na cokoliv...">
        <button id="poslat">→</button>
    </div>

    <script>
        // Opraveno pro nový formát klíčů začínající na AQ.
        const API_KEY = "AQ.Ab8RN6JjWkDPZvEYc3kG64Alsr_VNRB8s4NNFQ-P9fiT7nDo6Q";
        const MODEL = "gemini-1.5-flash";

        const povídání = document.getElementById('povídání');
        const promptInput = document.getElementById('výzva');
        const tlačítkoProOdeslání = document.getElementById('poslat');
        let dějiny = [];

        function přidatZprávu(text, autor) {
            const nováZpráva = document.createElement('div');
            nováZpráva.className = autor;
            nováZpráva.innerText = (autor === 'uživatel' ? 'Vy: ' : 'Gemini: ') + text;
            povídání.appendChild(nováZpráva);
            return nováZpráva;
        }

        async function sendToAi() {
            const text = promptInput.value.trim();
            if (!text || tlačítkoProOdeslání.disabled) return;

            přidatZprávu(text, 'uživatel');
            promptInput.value = '';
            tlačítkoProOdeslání.disabled = true;

            const aiDiv = přidatZprávu('Uvažte...', 'ai');

            try {
                dějiny.push({ role: "user", parts: [{ text: text }] });

                // Změněno na stabilní /v1/ endpoint, který podporuje AQ klíče
                const odpověď = await fetch(`https://googleapis.com{MODEL}:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: dějiny })
                });

                const data = await odpověď.json();
                
                // Ošetření struktury odpovědi
                if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                    const textOdpovědi = data.candidates[0].content.parts[0].text;
                    aiDiv.innerText = 'Gemini: ' + textOdpovědi;
                    dějiny.push({ role: "model", parts: [{ text: textOdpovědi }] });
                } else if (data.error) {
                    aiDiv.innerText = 'Chyba API: ' + data.error.message;
                } else {
                    aiDiv.innerText = 'Chyba: Obdržen neočekávaný formát dat.';
                }

            } catch (chyba) {
                aiDiv.innerText = 'Chyba: Nepodařilo se spojit s AI. Zkontrolujte připojení.';
                console.error(chyba);
            } finally {
                tlačítkoProOdeslání.disabled = false;
            }
        }

        tlačítkoProOdeslání.addEventListener('click', sendToAi);
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendToAi();
        });
    </script>
</body>
</html>
