    <script>
        async function sendMessage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('modelSelect').value;
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();

            if (!apiKey) { alert('Prosím, zadej svůj API klíč nahoře!'); return; }
            if (!text) return;

            appendMessage(text, 'user');
            inputField.value = '';

            const aiMessageElement = appendMessage('Přemýšlím...', 'ai');

            try {
                // Používáme správný oficiální endpoint pro Gemini API
                const url = `https://googleapis.com{model}:generateContent?key=${apiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: text }]
                        }]
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'Chyba API');
                }

                const data = await response.json();
                // Správné vytažení textu ze struktury Gemini odpovědi
                const aiText = data.candidates[0].content.parts[0].text;
                aiMessageElement.innerText = aiText;
            } catch (error) {
                console.error(error);
                aiMessageElement.innerText = `Chyba: ${error.message}. Zkontroluj, zda máš správný API klíč a vybraný podporovaný model.`;
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-container');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerText = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
            return msg;
        }
    </script>
